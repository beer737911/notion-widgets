<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Calendar Widget - Notion Dark Mode</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #191919;
      --card-bg: #202020;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #e6e6e6;
      --text-secondary: #9b9a97;
      --accent: #529cca;
      --btn-bg: #2d2d2d;
      --btn-hover: #383838;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      font-family: 'Plus Jakarta Sans', 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
      overflow: hidden;
    }

    /* Container Box */
    .calendar-card {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
    }

    /* Top Bar Header */
    .calendar-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #202020;
      border-bottom: 1px solid var(--card-border);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .calendar-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
    }

    .calendar-title svg {
      width: 16px;
      height: 16px;
      color: var(--accent);
    }

    .calendar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-tag {
      font-size: 11px;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }

    .open-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      color: #fff;
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.15s;
    }

    .open-btn:hover {
      background: var(--btn-hover);
      color: var(--accent);
    }

    /* Iframe Wrapper with Dark Invert Filter */
    .iframe-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      background: #191919;
      overflow: hidden;
    }

    /* Invert & adjust hue so Google Calendar embed looks native dark */
    .calendar-iframe {
      width: 100%;
      height: 100%;
      border: none;
      filter: invert(0.9) hue-rotate(180deg) brightness(0.92) contrast(1.15);
    }
  </style>
</head>
<body>

  <div class="calendar-card">
    <div class="calendar-bar">
      <div class="calendar-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>Google Calendar</span>
        <span class="badge-tag">🇹🇭 วันหยุดไทย</span>
      </div>
      <div class="calendar-actions">
        <a href="https://calendar.google.com" target="_blank" rel="noopener noreferrer" class="open-btn">
          เปิด Google Calendar ↗
        </a>
      </div>
    </div>

    <div class="iframe-wrapper">
      <iframe 
        class="calendar-iframe" 
        src="https://calendar.google.com/calendar/u/0/embed?src=th.th%23holiday@group.v.calendar.google.com&ctz=Asia/Bangkok&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=1&showCalendars=0&showTz=0" 
        frameborder="0" 
        scrolling="no"
        loading="lazy">
      </iframe>
    </div>
  </div>

</body>
</html>
